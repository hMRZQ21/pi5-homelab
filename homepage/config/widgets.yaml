---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- greeting:
    text_size: 3xl
    text: Welcome back, Hussam

- datetime:
    text_size: xl
    format:
      dateStyle: full
      timeStyle: short
      hour12: true

- resources:
    cpu: true
    memory: true
    disk: /
    cputemp: true
    units: metric

# SSD temperature (Glances is limited to the NVMe sensor by glances.conf).
- glances:
    url: http://127.0.0.1:61208
    version: 4
    cpu: false
    mem: false
    cputemp: true
    cpuSensorLabel: Composite

# Weather under the clock (Open-Meteo, no API key). City-level coordinates.
- openmeteo:
    label: New York
    latitude: 40.7128
    longitude: -74.0060
    units: imperial
    cache: 5
    format:
      maximumFractionDigits: 0