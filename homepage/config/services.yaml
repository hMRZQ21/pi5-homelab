---
- Infrastructure:
    - Portainer:
        icon: portainer.png
        href: https://{{HOMEPAGE_VAR_TAILNET_HOST}}:9443
        description: Container management
        server: my-docker
        container: portainer
        showStats: true

    - Homepage:
        icon: homepage.png
        href: http://{{HOMEPAGE_VAR_TAILNET_HOST}}:3000
        description: This dashboard
        server: my-docker
        container: homepage
        showStats: true

- Immich:
    - Immich Server:
        icon: immich.png
        description: Photo library (import paused)
        server: my-docker
        container: immich_server
        showStats: true

    - Postgres:
        icon: postgresql.png
        description: Immich database
        server: my-docker
        container: immich_postgres
        showStats: true

    - Machine Learning:
        icon: mdi-brain
        description: Search and face detection
        server: my-docker
        container: immich_machine_learning
        showStats: true

    - Valkey:
        icon: valkey.png
        description: Immich cache and queue
        server: my-docker
        container: immich_redis
        showStats: true

- System:
    - SSD Temp:
        icon: mdi-harddisk
        description: Samsung 990 PRO
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: sensor:Composite
          chart: false
