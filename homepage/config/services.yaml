---
- Infrastructure:
    - Portainer:
        icon: portainer.png
        href: https://{{HOMEPAGE_VAR_TAILNET_HOST}}:9443
        description: Container management
        server: my-docker
        container: portainer
        showStats: true

    - Homepage:
        icon: homepage.png
        href: http://{{HOMEPAGE_VAR_TAILNET_HOST}}:3000
        description: This dashboard
        server: my-docker
        container: homepage
        showStats: true

- Immich:
    - Immich Server:
        icon: immich.png
        href: http://rasppi.local:2283
        description: Photo library
        server: my-docker
        container: immich_server
        showStats: true
        widget:
          type: immich
          url: http://localhost:2283
          key: "{{HOMEPAGE_VAR_IMMICH_STATS_KEY}}"
          version: 2
          fields: ["photos", "videos", "storage"]

    - Postgres:
        icon: postgresql.png
        description: Immich database
        server: my-docker
        container: immich_postgres
        showStats: true

    - Machine Learning:
        icon: mdi-brain
        description: Search and face detection
        server: my-docker
        container: immich_machine_learning
        showStats: true

    - Valkey:
        icon: valkey.png
        description: Immich cache and queue
        server: my-docker
        container: immich_redis
        showStats: true

    - Photo Review:
        icon: mdi-calendar-check
        href: http://{{HOMEPAGE_VAR_TAILNET_HOST}}:2290
        description: Family photo-date review
        server: my-docker
        container: photo-review
        showStats: true

- System:
    - LAN Traffic:
        icon: mdi-lan
        description: Pi eth0 (host)
        widget:
          type: glances
          url: http://127.0.0.1:61208
          version: 4
          metric: network:eth0
          chart: true

    - Disk:
        icon: mdi-harddisk
        description: Pi storage, updated daily
        widget:
          type: customapi
          # Static file written by bin/pi5-disk --json, served from Homepage's own public/ folder (see compose.yaml).
          url: http://127.0.0.1:3000/disk/disk.json
          refreshInterval: 300000
          mappings:
            - field: used_pct
              label: Used
              format: number
              suffix: " %"
            - field: originals_gb
              label: Originals
              format: number
              suffix: " GB"
            - field: transcodes_gb
              label: Transcodes
              format: number
              suffix: " GB"
            - field: trash
              label: Trash
              format: text
