<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Photo Review</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e3e1dc;--acc:#2f6f5e;--acc-ink:#fff;--warn:#a5551c;--tile:#d9d6cf;--chip:#eef3f1;--ok:#2f6f5e}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe7;--muted:#9c9a94;--line:#33322f;--acc:#5fb39a;--acc-ink:#0e1a16;--warn:#e09a62;--tile:#3a3936;--chip:#22302b;--ok:#5fb39a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font-weight:600;font-size:17px}
.prog{color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.who{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.nav select{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:22px;margin:0 0 4px;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.chip{background:var(--chip);border-radius:8px;padding:4px 9px;font-size:13px;overflow-wrap:anywhere}
.conflict{border-left:3px solid var(--warn);padding:8px 12px;margin:0 0 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.ph{aspect-ratio:1;border-radius:8px;background:var(--tile);position:relative;cursor:pointer;overflow:hidden;border:2px solid transparent;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .play{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;font-size:11px;padding:2px 7px;pointer-events:none}
.ph.out{border-color:var(--warn)}
.ph.out img{opacity:.45}
.ph.out::after{content:"odd one out";position:absolute;top:4px;left:4px;right:4px;font-size:10px;background:var(--warn);color:#fff;border-radius:4px;text-align:center}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.q{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.q h2{font-size:17px;margin:0 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer;font:inherit}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.opt input{width:90px;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.row label{font-weight:600}
.row select{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:54px;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);font:inherit}
.prev{margin-top:12px;font-size:13px}
.prev div{padding:4px 0;border-top:1px dashed var(--line)}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
.msg{font-size:13px;min-height:18px;margin-top:8px}
.msg.err{color:var(--warn)} .msg.ok{color:var(--ok)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov.on{display:flex}
.ov img,.ov video{max-width:100%;max-height:74vh;border-radius:6px;background:#000}
.ov video{width:min(100%,720px)}
.ov .bar2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.ov .cap{color:#ddd;font-size:13px;margin-top:8px;text-align:center;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;margin-top:6px}.tabs a{font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none}.tabs a.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.jumpq{display:inline-block;margin:0 0 12px;font-size:14px;color:var(--acc)}
.mode{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:13px;color:var(--muted)}
.more{display:block;width:100%;margin-top:10px}
.cnt{margin-left:auto}
.note{color:var(--muted);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="brand">Family Photo Review</div><div class="prog" id="prog">Loading…</div><div class="tabs"><a class="on" href="./">Photo questions</a><a href="dups">Duplicates</a></div></div>
    <div class="who" id="who">Who's answering?</div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="nav">
    <button class="btn sec" id="prevG" aria-label="Previous group">←</button>
    <select id="jump" aria-label="Jump to group"></select>
    <button class="btn sec" id="nextG" aria-label="Next group">→</button>
  </div>
  <div class="card" id="card"></div>
  <p class="note">Your answer is saved with your name. Nothing in the photo library changes until Hussam reviews the answers and applies them; every change is logged and can be undone.</p>
</div>
<div class="ov" id="ov">
  <img id="ovImg" alt="">
  <video id="ovVid" controls playsinline preload="metadata"></video>
  <div class="cap" id="ovCap"></div>
  <div class="bar2">
    <button class="btn sec" id="ovPrev" style="color:#fff;border-color:#666">←</button>
    <button class="btn sec" id="ovOut" style="color:#fff;border-color:#666">Mark: odd one out</button>
    <button class="btn sec" id="ovNext" style="color:#fff;border-color:#666">→</button>
    <button class="btn pri" id="ovClose">Close</button>
  </div>
</div>
<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const OWNER_HELP={Family:'A shared family camera',"Someone else":'Friends or relatives sent these to us'};
const $=id=>document.getElementById(id);
const el=(tag,props={},kids=[])=>{const e=document.createElement(tag);Object.assign(e,props);for(const k of kids)e.append(k);return e};
let S={people:[],owners:[],groups:[],answers:[]},gi=0,who=null,choice=null,owners=new Set(),excluded=new Set(),ovIdx=0,markMode=false;
try{who=localStorage.getItem('pr_who')}catch(e){}
try{gi=+(localStorage.getItem('pr_gi')||0)}catch(e){}
function fmtDate(s){const d=new Date(s.replace(' ','T'));return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getFullYear()}
function yearsLabel(ys){if(!ys.length)return'';return ys.length>2?ys[0]+'–'+ys[ys.length-1]:ys.join(' or ')}
function answersFor(id){return S.answers.filter(a=>a.group===id)}
function latestByPerson(id){const m={};for(const a of answersFor(id))m[a.who]=a;return Object.values(m)}
function nVid(g){return g.assets.filter(a=>a.type==='VIDEO').length}
function itemsLabel(g,n){const v=nVid(g),p=g.assets.length-v;n=(n??g.total??g.assets.length).toLocaleString();return v&&p?n+' photos & videos':n+(v?' videos':' photos')}
function ansText(a){if(a.unsure)return'not sure';if(a.kind==='owner')return(a.owners||[]).join(', ');return a.year+(a.month?', '+MONTHS[a.month-1]:'')}
async function load(){
  const r=await fetch('api/state',{cache:'no-store'});S=await r.json();
  if(!Number.isInteger(gi)||gi<0||gi>=S.groups.length)gi=0;renderWho();render();
}
function renderWho(){
  const w=$('who');w.replaceChildren('Who\'s answering?');
  for(const p of S.people){const b=el('button',{className:'pill'+(p===who?' on':''),textContent:p});b.onclick=()=>{who=p;try{localStorage.setItem('pr_who',p)}catch(e){};renderWho();render()};w.append(b)}
}
function setMsg(t,cls=''){const m=$('msg');if(m){m.textContent=t;m.className='msg '+cls}}
function previous(g){
  const prev=el('div',{className:'prev'}),prevA=latestByPerson(g.id);
  if(prevA.length){prev.append(el('b',{textContent:'Answers so far'}));for(const a of prevA)prev.append(el('div',{textContent:`${a.who}: ${ansText(a)}${a.excluded&&a.excluded.length?` (${a.excluded.length} marked odd one out)`:''}${a.note?' — “'+a.note+'”':''}`}))}
  return prev;
}
function tile(a,i){const kids=[el('img',{src:'img/t/'+a.id,alt:a.name,loading:'lazy'})];if(a.type==='VIDEO')kids.push(el('span',{className:'play',textContent:'▶ video'}));
  const b=el('button',{className:'ph'+(excluded.has(a.id)?' out':''),title:a.name},kids);b.onclick=()=>markMode?toggleOut(a.id):openOv(i);b.oncontextmenu=e=>{e.preventDefault();toggleOut(a.id)};b.dataset.id=a.id;return b}
function gridFor(g){
  const grid=el('div',{className:'grid'});g.assets.forEach((a,i)=>grid.append(tile(a,i)));
  const total=g.total??g.assets.length,wrap=el('div',{},[grid]);
  const vb=el('button',{className:'pill'+(markMode?'':' on'),textContent:'View it bigger'}),mb=el('button',{className:'pill'+(markMode?' on':''),textContent:'Mark odd ones out'});
  vb.onclick=()=>{markMode=false;vb.classList.add('on');mb.classList.remove('on')};mb.onclick=()=>{markMode=true;mb.classList.add('on');vb.classList.remove('on')};
  const mode=el('div',{className:'mode'},['Tap a photo to:',vb,mb,el('span',{className:'cnt',id:'cnt'})]);
  if(g.assets.length<total){
    const more=el('button',{className:'btn sec more'});const lab=()=>{const left=total-g.assets.length;more.textContent=`Show more (${Math.min(120,left)} of ${left.toLocaleString()} left)`};lab();
    more.onclick=async()=>{more.disabled=true;try{const r=await fetch(`api/more?g=${encodeURIComponent(g.id)}&o=${g.assets.length}&n=120`);const d=await r.json();if(!r.ok)throw new Error(d.error);
      const start=g.assets.length;d.assets.forEach((a,k)=>{g.assets.push(a);grid.append(tile(a,start+k))});if(g.assets.length>=total)more.remove();else{lab();more.disabled=false}}
      catch(e){more.textContent='Could not load more — tap to retry';more.disabled=false}};
    wrap.append(more,el('div',{className:'hint',textContent:`Showing oldest first. ${total.toLocaleString()} in total.`}));
  }
  return el('div',{},[mode,wrap]);
}
function updCnt(){const c=$('cnt');if(c)c.textContent=excluded.size?excluded.size+' marked odd one out':''}
function render(){
  const mine=g=>S.answers.some(a=>a.group===g.id&&(!who||a.who===who));
  const total=S.groups.length,done=S.groups.filter(mine).length;
  $('prog').textContent=`${S.round_title||'Review'} · ${done} of ${total} answered${who?' by '+who:''}`;
  $('bar').style.width=(total?100*done/total:0)+'%';
  const j=$('jump');j.replaceChildren(...S.groups.map((g,i)=>el('option',{value:i,textContent:`${mine(g)?'✓ ':''}${g.kind==='owner'?'Whose? ':'When? '}${g.title} · ${itemsLabel(g)}`})));j.value=gi;
  try{localStorage.setItem('pr_gi',gi)}catch(e){}
  const g=S.groups[gi],card=$('card');choice=null;owners=new Set();excluded=new Set();
  if(!g){card.replaceChildren(el('p',{textContent:'Nothing to review right now.'}));return}
  const note=el('textarea',{id:'note',placeholder:"Anything you remember? (optional)",maxLength:1000});
  const save=el('button',{className:'btn pri',textContent:'Save & next →'});
  const foot=el('div',{className:'foot'},[el('span',{className:'hint',style:'margin:0',textContent:`${gi+1} of ${S.groups.length}`}),save]);
  const post=async body=>{
    save.disabled=true;
    try{const r=await fetch('api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();
      if(!r.ok)throw new Error(d.error||'save failed');S.answers.push(d.saved);
      const n=S.groups.length,mine=new Set(S.answers.filter(a=>a.who===who).map(a=>a.group));let nx=-1;
      for(let k=1;k<=n;k++){const j=(gi+k)%n;if(!mine.has(S.groups[j].id)){nx=j;break}}
      if(nx>=0){gi=nx;render();setMsg('Saved. Thank you!','ok')}else{render();setMsg('Saved — you have answered everything. Thank you!','ok')}window.scrollTo(0,0)}
    catch(e){setMsg('Could not save: '+e.message,'err');save.disabled=false}
  };
  if(g.kind==='owner')return renderOwner(g,card,note,save,foot,post);
  renderDate(g,card,note,save,foot,post);
}
function renderOwner(g,card,note,save,foot,post){
  const opts=el('div',{className:'opts'});
  for(const o of S.owners){const b=el('button',{className:'opt'},[o,el('small',{textContent:OWNER_HELP[o]||'Their camera or phone'})]);
    b.onclick=()=>{owners.has(o)?owners.delete(o):owners.add(o);b.classList.toggle('on',owners.has(o));ub.classList.remove('on');choice=owners.size?'owners':null;setMsg('')};opts.append(b)}
  const ub=el('button',{className:'opt'},['Not sure',el('small',{textContent:'Skip — let someone else answer'})]);
  ub.onclick=()=>{owners.clear();opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));ub.classList.add('on');choice='unsure';setMsg('')};opts.append(ub);
  save.onclick=()=>{
    if(!who)return setMsg('First pick who is answering (top of the page).','err');
    if(!choice)return setMsg('Pick one or more people, or "Not sure".','err');
    post({group:g.id,who,unsure:choice==='unsure',owners:choice==='unsure'?[]:[...owners],note:note.value.trim(),excluded:[...excluded]});
  };
  const isCam=g.camera!=='CD/DVD videos'&&!g.say,v=g.videos||0,p=g.count-v; // g.say: a follow-up group (odd ones out)
  const facts=[el('span',{className:'chip',textContent:isCam?(v?`${g.count.toLocaleString()} items in the library (${p.toLocaleString()} photos, ${v} videos)`:`${g.count.toLocaleString()} photos in the library`):itemsLabel(g)}),
    el('span',{className:'chip',textContent:`Years: ${g.years[0]===g.years[1]?g.years[0]:g.years[0]+'–'+g.years[1]}`})];
  for(const f of g.folders||[])facts.push(el('span',{className:'chip',textContent:'Folder: '+f}));
  card.replaceChildren(
    el('h1',{textContent:isCam?'Camera: '+g.title:g.title}),
    el('div',{className:'facts'},facts),
    el('div',{className:'conflict',textContent:g.say||(isCam?`Everything taken with this camera is below. Whose camera or phone was it?`:`Old family videos from CDs/DVDs. Whose are they?${g.suggest?' Hussam thinks: '+g.suggest+'.':''}`)}),
    el('a',{className:'jumpq',href:'#q',textContent:'Skip to the question ↓'}),
    gridFor(g),
    el('div',{className:'hint',textContent:'Videos play when opened. If something doesn\'t belong, switch to "Mark odd ones out" and tap it.'}),
    el('div',{className:'q',id:'q'},[el('h2',{textContent:isCam?'Whose camera was this? (pick all that apply)':g.say?'Whose are these? (pick all that apply)':'Whose videos are these? (pick all that apply)'}),opts,note,previous(g),el('div',{className:'msg',id:'msg'}),foot])
  );
}
function renderDate(g,card,note,save,foot,post){
  const opts=el('div',{className:'opts'}),seen=new Set();
  const add=(y,why)=>{if(seen.has(y))return;seen.add(y);const b=el('button',{className:'opt'},[String(y),el('small',{textContent:why})]);b.onclick=()=>pick(b,{year:y});opts.append(b);return b};
  let pre=null,monthHint='',say;
  if(g.say){ // video rounds
    if(g.known_year)pre=add(g.known_year,'Already set — keep it');
    (g.current_years||[]).forEach(y=>add(y,'What it shows now'));
    say=g.say;
  }else{ // photo rounds (1–2)
    const folderYears=g.folder_years||[],camYears=(g.camera_years||[]).map(Number);
    if(folderYears.length&&folderYears.length<=6)folderYears.forEach(y=>add(y,'From the folder name'));
    camYears.forEach(y=>add(y,'What the camera says'));
    const camRange=g.first.slice(0,10)===g.last.slice(0,10)?fmtDate(g.first):fmtDate(g.first)+' – '+fmtDate(g.last);
    say=`The camera says ${camRange}. The folder name says ${yearsLabel(folderYears)||'no year'}.`;
    if(g.camera_month)monthHint='The camera says '+MONTHS[g.camera_month-1];
  }
  const other=el('input',{placeholder:'e.g. 2005',inputMode:'numeric',maxLength:4});
  const ob=el('button',{className:'opt'},['Another year: ',other,el('small',{textContent:'Type it in'})]);
  ob.onclick=e=>{pick(ob,{year:'other'});if(e.target!==other)other.focus()};other.oninput=()=>pick(ob,{year:'other'});opts.append(ob);
  const ub=el('button',{className:'opt'},['Not sure',el('small',{textContent:'Skip — let someone else answer'})]);ub.onclick=()=>pick(ub,{unsure:true});opts.append(ub);
  if(pre)pick(pre,{year:g.known_year});
  const ms=el('select',{id:'month'});ms.append(el('option',{value:'',textContent:"Don't know"}));MONTHS.forEach((m,i)=>ms.append(el('option',{value:i+1,textContent:m})));
  save.onclick=()=>{
    if(!who)return setMsg('First pick who is answering (top of the page).','err');
    if(!choice)return setMsg('Pick a year, or "Not sure".','err');
    let year=choice.year;if(year==='other'){year=parseInt(other.value,10);if(!(year>=1950&&year<=new Date().getFullYear()))return setMsg('Type a year between 1950 and now.','err')}
    post({group:g.id,who,unsure:!!choice.unsure,year:choice.unsure?null:year,month:ms.value?+ms.value:null,note:note.value.trim(),excluded:[...excluded]});
  };
  const facts=[el('span',{className:'chip',textContent:itemsLabel(g)})];
  if(g.camera)facts.push(el('span',{className:'chip',textContent:'Camera: '+g.camera}));
  if(g.folder)facts.push(el('span',{className:'chip',textContent:'Folder: '+g.folder}));
  const tierMonth=g.tier==='month';
  card.replaceChildren(
    el('h1',{textContent:g.title}),
    el('div',{className:'facts'},facts),
    el('div',{className:'conflict',textContent:say}),
    el('a',{className:'jumpq',href:'#q',textContent:'Skip to the question ↓'}),
    gridFor(g),
    el('div',{className:'hint',textContent:'Videos play when opened. If something is from a different event, switch to "Mark odd ones out" and tap it.'}),
    el('div',{className:'q',id:'q'},[el('h2',{textContent:tierMonth?'Which month? (and is the year right?)':'What year were these taken?'}),opts,
      el('div',{className:'row'},[el('label',{htmlFor:'month',textContent:tierMonth?'Month:':'Month (optional):'}),ms,monthHint?el('span',{className:'hint',style:'margin:0',textContent:monthHint}):'']),
      note,previous(g),el('div',{className:'msg',id:'msg'}),foot])
  );
}
function pick(btn,c){document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));btn.classList.add('on');choice=c;setMsg('')}
function toggleOut(id){excluded.has(id)?excluded.delete(id):excluded.add(id);document.querySelectorAll('.ph').forEach(p=>p.classList.toggle('out',excluded.has(p.dataset.id)));updCnt();updOv()}
function openOv(i){ovIdx=i;$('ov').classList.add('on');updOv()}
function stopVid(){const v=$('ovVid');v.pause();v.removeAttribute('src');v.load()}
function updOv(){const g=S.groups[gi];if(!g||!$('ov').classList.contains('on'))return;const a=g.assets[ovIdx],v=$('ovVid'),im=$('ovImg');
  if(a.type==='VIDEO'){im.style.display='none';v.style.display='';const src='vid/'+a.id;if(!v.src.endsWith(src)){v.poster='img/p/'+a.id;v.src=src}}
  else{stopVid();v.style.display='none';im.style.display='';im.src='img/p/'+a.id}
  $('ovCap').textContent=`${a.name} · shows as ${fmtDate(a.date)} · ${ovIdx+1}/${g.assets.length}`;$('ovOut').textContent=excluded.has(a.id)?'Undo: odd one out':'Mark: odd one out'}
$('ovClose').onclick=()=>{stopVid();$('ov').classList.remove('on')};
$('ovPrev').onclick=()=>{const n=S.groups[gi].assets.length;ovIdx=(ovIdx-1+n)%n;updOv()};
$('ovNext').onclick=()=>{const n=S.groups[gi].assets.length;ovIdx=(ovIdx+1)%n;updOv()};
$('ovOut').onclick=()=>toggleOut(S.groups[gi].assets[ovIdx].id);
document.addEventListener('keydown',e=>{if(!$('ov').classList.contains('on'))return;if(e.key==='Escape')$('ovClose').click();if(e.key==='ArrowLeft')$('ovPrev').click();if(e.key==='ArrowRight')$('ovNext').click()});
$('prevG').onclick=()=>{gi=(gi-1+S.groups.length)%S.groups.length;render()};
$('nextG').onclick=()=>{gi=(gi+1)%S.groups.length;render()};
$('jump').onchange=e=>{gi=+e.target.value;render()};
load().catch(e=>{$('card').textContent='Could not load: '+e.message});
</script>
</body>
</html>
