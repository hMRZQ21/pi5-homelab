name: photo-review

# Family review page (photo/video dates, whose camera). Records answers only; it never writes to Immich.
# Immich folders are mounted read-only: thumbnails, transcoded videos, originals (for videos without a transcode).
# Answers: /srv/photo-review/answers.jsonl (append-only). Groups: /srv/photo-review/groups.json.
services:
  photo-review:
    image: python:3.13.16-alpine3.24
    container_name: photo-review
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-u", "/app/app.py"]
    ports:
      - "2290:8080"
    environment:
      - TZ=America/New_York
    volumes:
      - ./app:/app:ro
      - /srv/photo-review:/data
      - /srv/immich/library/thumbs:/thumbs:ro
      - /srv/immich/library/encoded-video:/enc:ro
      - /srv/immich/library/library:/orig:ro
